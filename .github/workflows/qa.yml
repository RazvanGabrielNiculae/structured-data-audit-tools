name: QA
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 tools/audit_jsonld.py examples/article.html --require-type Article
      - run: python3 -m unittest discover -s tests -v
